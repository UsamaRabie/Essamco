<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <!-- Text path for top curved text -->
    <path id="isoCurve9001" d="M 14 62 A 46 46 0 0 1 106 62" fill="none" />
    <!-- Gradient for globe -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Globe Outer Circle -->
  <circle cx="60" cy="60" r="42" fill="url(#globeGrad)" stroke="#1D4ED8" stroke-width="2.5" />

  <!-- Globe Grid Lines (Latitudes & Longitudes) -->
  <g stroke="#3B82F6" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- Equator -->
    <line x1="18" y1="60" x2="102" y2="60" stroke-width="1.5" />
    <!-- Parallels -->
    <ellipse cx="60" cy="60" rx="42" ry="22" stroke-dasharray="2 1" />
    <ellipse cx="60" cy="60" rx="42" ry="34" />
    <line x1="26" y1="40" x2="94" y2="40" stroke-width="0.8" opacity="0.7" />
    <line x1="26" y1="80" x2="94" y2="80" stroke-width="0.8" opacity="0.7" />
    <!-- Meridians -->
    <line x1="60" y1="18" x2="60" y2="102" stroke-width="1.5" />
    <ellipse cx="60" cy="60" rx="20" ry="42" />
    <ellipse cx="60" cy="60" rx="33" ry="42" stroke-dasharray="3 1.5" />
  </g>

  <!-- Curved Text: International Organization for Standardization -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.4" font-weight="700" fill="#1E40AF" letter-spacing="0.2">
    <textPath href="#isoCurve9001" startOffset="50%" text-anchor="middle">
      International Organization for Standardization
    </textPath>
  </text>

  <!-- ISO Center Text Background Pill / Contrast Badge -->
  <rect x="22" y="44" width="76" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#1D4ED8" stroke-width="1.5" />

  <!-- ISO Text -->
  <text x="60" y="69" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#1E3A8A" letter-spacing="2">
    ISO
  </text>

  <!-- Standard Number Below -->
  <text x="60" y="124" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1E3A8A" letter-spacing="0.5">
    9001
  </text>
</svg>
